name: ci

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify
        required: false
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci
      - run: scripts/package-release-version-test.sh
      - run: npm run check:generated
      - run: npm run check:types
      - run: npm run check:embedded-web
      - run: |
          npm run fixture:conformance
          git diff --exit-code -- conformance/fixtures
          npm run conformance
      - run: go test ./... -count=1
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go build ./...
      - run: npx playwright install --with-deps chromium
      - run: npm run web:e2e
